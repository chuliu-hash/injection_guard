[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "injection-guard"
version = "0.1.0"
description = "InjectionGuard：LLM 安全护栏（提示注入 / 越狱双向检测）+ OpenAI 兼容推理服务"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "injection_guard" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "openai>=1.0",
    "numpy",
    "requests",
    # 会话/消息持久化（SQLite 默认，生产可切 PostgreSQL；PG 驱动需另装 psycopg[binary]）
    "sqlalchemy>=2.0",
    # 登录鉴权：PyJWT 签发/校验访问令牌；bcrypt 哈希口令
    "pyjwt>=2.8",
    "bcrypt>=4.0",
    # Agent 编排 + RAG（LangChain 生态）：
    #   * langgraph —— 检测流水线的状态图编排（节点 / 条件边 / 事件流）；
    #   * langchain-core —— Embeddings / VectorStore / Retriever 接口层；
    #   * langchain-community —— FAISS 向量库集成（独立的 langchain-faiss 需
    #     Python>=3.11，本项目为 3.10，故仍走 community 0.4.x）；
    #   * faiss-cpu —— 本地向量索引后端（与 torch 2.5.1 无冲突）。
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-community>=0.4,<1",
    #   * langchain-openai —— ChatModel 接入本地/云端 OpenAI 兼容接口（聊天生成 +
    #     输入/输出检测的 LLM 调用）；注意它按官方 API 发 max_completion_tokens，
    #     本地推理服务（llm_server.ChatCompletionRequest）已同时兼容该字段名。
    "langchain-openai>=1.0,<2",
    "faiss-cpu>=1.9",
    # 模型推理相关：以下为**已验证可共存**的组合，勿随意升级（详见 requirements.txt 注释）。
    # transformers 5.x 需 torch>=2.6，但 GPTQ 加载所需的 gptqmodel 在 torch 2.6
    # 只有 manylinux_2_28 内核 wheel（本机 glibc 2.27 不可用），故整体停在 4.x + torch 2.5。
    "torch==2.5.1",
    "transformers==4.55.2",
    "accelerate==1.10.0",
    "sentence-transformers==5.7.0",
    "peft",
    # GPTQ 加载（transformers GptqHfQuantizer 要求 optimum + gptqmodel）
    "optimum==1.27.0",
    "gptqmodel==2.2.0",
    # gptqmodel 导入依赖 datasets；glibc 2.27 限制 pyarrow 只能到 18
    "datasets==3.6.0",
    "pyarrow==18.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
injection-guard-defense = "injection_guard.cli.serve_defense:main"
injection-guard-llm = "injection_guard.cli.serve_llm:main"
injection-guard-embed = "injection_guard.cli.serve_embed:main"
injection-guard-deploy = "injection_guard.cli.deploy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
injection_guard = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
# E501：交由格式化处理（含较长的 prompt 模板与日志行）
# B008：FastAPI 的 `Depends(...)` 默认参数惯用法，非缺陷
ignore = ["E501", "B008"]
